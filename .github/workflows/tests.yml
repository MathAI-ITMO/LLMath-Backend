name: Run Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Run Unit Tests
      run: dotnet test tests/MathLLMBackend.Tests/MathLLMBackend.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory:"${{ runner.temp }}/test-results" --logger:"trx;LogFileName=unit-tests.trx"
      
    - name: Run Integration Tests
      run: dotnet test tests/MathLLMBackend.IntegrationTests/MathLLMBackend.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory:"${{ runner.temp }}/test-results" --logger:"trx;LogFileName=integration-tests.trx"
      
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        test-results-files: |
          ${{ runner.temp }}/test-results/**/*.trx
        check-name: Test Results
        fail-on: 'test failures'
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ${{ runner.temp }}/test-results
        retention-days: 30
        
    - name: Upload code coverage
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ${{ runner.temp }}/test-results/**/coverage.cobertura.xml
        fail_ci_if_error: false
